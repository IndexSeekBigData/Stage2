# InverSeek Ingestion Service configuration.
# Every key can be overridden by an environment variable with the same name in upper case and
# with dots and dashes replaced by underscores (ingestion.port -> INGESTION_PORT).

# HTTP port of this replica.
ingestion.port=7001

# Root folder of the datalake. Relative paths are resolved from the working directory.
# On Windows keep it outside OneDrive (for example C:/BD/stage2/data/datalake).
datalake.path=../data/datalake

# Time zone used for the AAAAMMDD/HH partition folders.
datalake.partition-zone=UTC

# Project Gutenberg base URL (tests point it to a local fake server).
gutenberg.base-url=https://www.gutenberg.org

# Maximum time for one download, and maximum accepted size of one book in bytes (50 MiB).
download.timeout-seconds=60
download.max-bytes=52428800

# Maximum Jetty request threads. 0 keeps the Javalin/Jetty default.
server.max-threads=0
