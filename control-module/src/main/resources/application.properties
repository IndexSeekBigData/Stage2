# InverSeek Control Module configuration.
# Environment variables override these values: upper case, dots and dashes replaced by underscores
# (ingestion.url -> INGESTION_URL). Relative paths resolve from the working directory.
control.port=7000
control.db.path=../data/control/control.db
# One URL or a comma-separated list, distributed round-robin.
ingestion.url=http://localhost:7001
indexing.url=http://localhost:7002

# Worker threads that process books.
control.workers=4
# Attempts per phase (download, index) before a book becomes FAILED.
control.max-attempts=3

# Call timeouts. Each lease must exceed its call timeout, or healthy work would lose its lease.
ingestion.timeout-seconds=90
indexing.timeout-seconds=120
control.lease.ingest-seconds=120
control.lease.index-seconds=180

# Wait before retrying a book after a failed attempt (doubles per attempt).
control.retry-delay-seconds=2
# How often expired leases are released.
control.reaper-seconds=10
# Wait of an idle worker, and maximum wait of a worker while a service is unreachable.
control.idle-millis=500
control.max-backoff-seconds=10

# Maximum Jetty request threads. 0 keeps the Javalin/Jetty default.
server.max-threads=0
